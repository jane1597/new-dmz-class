[[mods]]
modId="reflexguard"
version="1.8.0"
displayName="Reflex Guard: Auto Parry, Dodge and Growth"
description='''
Always-on auto parry and auto dodge. Melee hits you take are parried (the attacker is knocked back, stunned and hit back) and everything else is dodged with a short sidestep. Made for souls-like modpacks like NightfallCraft. Also faster crop and tree growth, shorter animal breeding cooldown and faster baby growth. Config: config/reflexguard-common.toml and config/reflexguard-growth.toml.
'''

[[dependencies.reflexguard]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

