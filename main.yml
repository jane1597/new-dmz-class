name: Build DMZ Prodigy Class

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --no-daemon
      - name: Check the jar
        run: |
          unzip -l build/libs/*.jar
          unzip -l build/libs/*.jar | grep "META-INF/mods.toml"
          unzip -l build/libs/*.jar | grep "com/dmzprodigy/ProdigyClass.class"
          if unzip -l build/libs/*.jar | grep -q "com/dragonminez/"; then echo "stub classes leaked into the jar"; exit 1; fi
          unzip -l build/libs/*.jar | grep "assets/dmzprodigy/lang/en_us.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dmzprodigy-jar
          path: build/libs/*.jar
